<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAM 大混戰 - 英雄核心大裝與強化符文</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 2rem; }
        
        .search-box { width: 100%; padding: 14px 20px; font-size: 1.1rem; border: 2px solid #334155; border-radius: 10px; background: #1e293b; color: #fff; margin-bottom: 25px; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: #38bdf8; }

        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 18px; border: 1px solid #334155; }
        .hero-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .hero-avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #38bdf8; }
        .hero-name { font-size: 1.25rem; font-weight: bold; color: #f1f5f9; }
        .hero-title { font-size: 0.85rem; color: #94a3b8; }

        .section-title { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; margin: 12px 0 8px; letter-spacing: 0.5px; }
        .title-rune { color: #f59e0b; }
        .title-item { color: #38bdf8; }

        .icon-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .icon-item { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .icon-item img { width: 32px; height: 32px; border-radius: 6px; }
        .icon-item span { font-size: 0.85rem; color: #e2e8f0; font-weight: 500; }

        .no-data { text-align: center; color: #64748b; margin-top: 40px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ ARAM 大混戰 - 強化符文與核心裝備</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="輸入英雄中文名稱（如：拉克絲、露露、艾希）..." oninput="filterHeroes()">
    
    <div id="heroGrid" class="hero-grid"></div>
    <div id="noData" class="no-data" style="display: none;">找不到相符的英雄</div>
</div>

<script>
    let heroesData = {};

    fetch('heroes_data.json')
        .then(res => res.json())
        .then(data => {
            heroesData = data;
            renderHeroes(Object.values(heroesData));
        })
        .catch(err => console.error("載入英雄資料失敗:", err));

    function renderHeroes(list) {
        const grid = document.getElementById('heroGrid');
        const noData = document.getElementById('noData');
        grid.innerHTML = '';

        if (list.length === 0) {
            noData.style.display = 'block';
            return;
        }
        noData.style.display = 'none';

        list.forEach(hero => {
            const card = document.createElement('div');
            card.className = 'card';

            const runesHTML = hero.runes.map(r => `
                <div class="icon-item">
                    <img src="${r.icon}" alt="${r.name}" onerror="this.style.display='none'">
                    <span>${r.name}</span>
                </div>
            `).join('');

            const itemsHTML = hero.items.map(i => `
                <div class="icon-item">
                    <img src="${i.icon}" alt="${i.name}" onerror="this.style.display='none'">
                    <span>${i.name}</span>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="hero-header">
                    <img src="${hero.avatar}" alt="${hero.name}" class="hero-avatar">
                    <div>
                        <div class="hero-name">${hero.name}</div>
                        <div class="hero-title">${hero.title}</div>
                    </div>
                </div>
                
                <div class="section-title title-rune">✨ 強化符文</div>
                <div class="icon-list">${runesHTML || '<span style="color:#64748b">無資料</span>'}</div>

                <div class="section-title title-item">🛡️ 核心大裝</div>
                <div class="icon-list">${itemsHTML || '<span style="color:#64748b">無資料</span>'}</div>
            `;
            grid.appendChild(card);
        });
    }

    function filterHeroes() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = Object.values(heroesData).filter(hero => 
            hero.name.toLowerCase().includes(query) || 
            hero.id.toLowerCase().includes(query)
        );
        renderHeroes(filtered);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAM 大混戰 - 英雄核心裝備與 S級強化符文</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; }

        .search-box { 
            width: 100%; 
            padding: 14px 20px; 
            font-size: 1.1rem; 
            border: 2px solid #334155; 
            border-radius: 12px; 
            background: #1e293b; 
            color: #fff; 
            margin-bottom: 25px; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }
        .search-box:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 14px; padding: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        
        .hero-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .hero-avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #38bdf8; flex-shrink: 0; }
        .hero-name { font-size: 1.3rem; font-weight: bold; color: #f1f5f9; }
        .hero-title { font-size: 0.85rem; color: #94a3b8; }

        .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin: 14px 0 8px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .title-rune { color: #f59e0b; }
        .title-item { color: #38bdf8; }

        .icon-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .icon-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: #0f172a; 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            position: relative;
        }
        .icon-item img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
        .icon-item span.name { font-size: 0.85rem; color: #e2e8f0; font-weight: 500; }
        
        /* S級符文專用紅色標籤 */
        .s-badge { 
            background: #ef4444; 
            color: #ffffff; 
            font-size: 0.65rem; 
            font-weight: 800; 
            padding: 1px 5px; 
            border-radius: 4px; 
            text-transform: uppercase;
        }

        .no-data { text-align: center; color: #64748b; margin-top: 50px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ ARAM 大混戰出裝與符文指南</h1>
        <p class="subtitle">即時同步 OP.GG S級強化符文與核心成品大裝組合</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="搜尋英雄名稱（例如：拉克絲、露露、阿卡莉、伊絲瑞爾）..." oninput="filterHeroes()">
    
    <div id="heroGrid" class="hero-grid"></div>
    <div id="noData" class="no-data" style="display: none;">找不到對應的英雄數據</div>
</div>

<script>
    let heroesData = {};

    // 載入爬蟲生成的 JSON 檔案
    fetch('heroes_data.json')
        .then(res => res.json())
        .then(data => {
            heroesData = data;
            renderHeroes(Object.values(heroesData));
        })
        .catch(err => {
            console.error("載入 heroes_data.json 失敗:", err);
            document.getElementById('noData').innerText = "資料載入失敗，請確認 heroes_data.json 是否已上傳。";
            document.getElementById('noData').style.display = 'block';
        });

    function renderHeroes(list) {
        const grid = document.getElementById('heroGrid');
        const noData = document.getElementById('noData');
        grid.innerHTML = '';

        if (!list || list.length === 0) {
            noData.style.display = 'block';
            return;
        }
        noData.style.display = 'none';

        list.forEach(hero => {
            const card = document.createElement('div');
            card.className = 'card';

            // 強化符文列表
            const runesHTML = (hero.runes && hero.runes.length > 0) 
                ? hero.runes.map(r => `
                    <div class="icon-item">
                        <img src="${r.icon}" alt="${r.name}" onerror="this.style.display='none'">
                        <span class="name">${r.name}</span>
                        ${r.isSTier ? '<span class="s-badge">S</span>' : ''}
                    </div>
                `).join('')
                : '<span style="color:#64748b; font-size:0.85rem;">尚無符文數據</span>';

            // 核心裝備列表
            const itemsHTML = (hero.items && hero.items.length > 0)
                ? hero.items.map(i => `
                    <div class="icon-item">
                        <img src="${i.icon}" alt="${i.name}" onerror="this.style.display='none'">
                        <span class="name">${i.name}</span>
                    </div>
                `).join('')
                : '<span style="color:#64748b; font-size:0.85rem;">尚無核心裝備數據</span>';

            card.innerHTML = `
                <div class="hero-header">
                    <img src="${hero.avatar}" alt="${hero.name}" class="hero-avatar">
                    <div>
                        <div class="hero-name">${hero.name}</div>
                        <div class="hero-title">${hero.title}</div>
                    </div>
                </div>
                
                <div class="section-title title-rune">🔥 強化符文</div>
                <div class="icon-list">${runesHTML}</div>

                <div class="section-title title-item">🛡️ 核心成品大裝</div>
                <div class="icon-list">${itemsHTML}</div>
            `;
            grid.appendChild(card);
        });
    }

    function filterHeroes() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = Object.values(heroesData).filter(hero => 
            hero.name.toLowerCase().includes(query) || 
            hero.id.toLowerCase().includes(query)
        );
        renderHeroes(filtered);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAM 大混戰 - 全英雄 S級符文與核心裝備指南</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 8px; font-weight: 800; }
        p.subtitle { color: #94a3b8; font-size: 1rem; }

        .search-container { position: relative; max-width: 600px; margin: 0 auto 30px; }
        .search-box { 
            width: 100%; 
            padding: 16px 22px; 
            font-size: 1.1rem; 
            border: 2px solid #334155; 
            border-radius: 14px; 
            background: #1e293b; 
            color: #fff; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }
        .search-box:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25); }

        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
        
        .card { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 20px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .hero-header { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #334155; padding-bottom: 14px; }
        .hero-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #38bdf8; flex-shrink: 0; }
        .hero-info { flex-grow: 1; }
        .hero-name { font-size: 1.35rem; font-weight: bold; color: #f1f5f9; margin-bottom: 2px; }
        .hero-title { font-size: 0.88rem; color: #94a3b8; }

        .section-header { 
            font-size: 0.9rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 8px;
        }
        .title-rune { color: #f59e0b; }
        .title-item { color: #38bdf8; }
        .badge-count { background: #334155; color: #cbd5e1; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }

        .icon-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .icon-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: #0f172a; 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .icon-item img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
        .icon-item span.name { font-size: 0.85rem; color: #e2e8f0; font-weight: 500; }
        
        /* S 級符文徽章 */
        .s-badge { 
            background: #ef4444; 
            color: #ffffff; 
            font-size: 0.65rem; 
            font-weight: 800; 
            padding: 1px 5px; 
            border-radius: 4px; 
            margin-left: 2px;
        }

        .empty-text { color: #64748b; font-size: 0.85rem; font-style: italic; }
        .no-data { text-align: center; color: #64748b; margin-top: 60px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ ARAM 大混戰全攻略</h1>
        <p class="subtitle">即時查看全英雄 S 級強化符文與核心成品大裝列表</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="輸入英雄中文名稱或 ID 搜尋（例如：阿卡莉、伊絲瑞爾、lux）..." oninput="filterHeroes()">
    </div>
    
    <div id="heroGrid" class="hero-grid"></div>
    <div id="noData" class="no-data" style="display: none;">找不到對應的英雄數據</div>
</div>

<script>
    let heroesData = {};

    // 載入爬蟲生成的 JSON 數據
    fetch('heroes_data.json')
        .then(res => res.json())
        .then(data => {
            heroesData = data;
            renderHeroes(Object.values(heroesData));
        })
        .catch(err => {
            console.error("載入 heroes_data.json 失敗:", err);
            document.getElementById('noData').innerText = "數據載入失敗，請確認 heroes_data.json 已正確上傳至 GitHub。";
            document.getElementById('noData').style.display = 'block';
        });

    function renderHeroes(list) {
        const grid = document.getElementById('heroGrid');
        const noData = document.getElementById('noData');
        grid.innerHTML = '';

        if (!list || list.length === 0) {
            noData.style.display = 'block';
            return;
        }
        noData.style.display = 'none';

        list.forEach(hero => {
            const card = document.createElement('div');
            card.className = 'card';

            const runeCount = hero.runes ? hero.runes.length : 0;
            const itemCount = hero.items ? hero.items.length : 0;

            // 1. 產生強化符文 HTML
            const runesHTML = (hero.runes && hero.runes.length > 0) 
                ? hero.runes.map(r => `
                    <div class="icon-item">
                        <img src="${r.icon}" alt="${r.name}" onerror="this.style.display='none'">
                        <span class="name">${r.name}</span>
                        ${r.isSTier ? '<span class="s-badge">S</span>' : ''}
                    </div>
                `).join('')
                : '<span class="empty-text">無 S 級符文數據</span>';

            // 2. 產生核心裝備 HTML
            const itemsHTML = (hero.items && hero.items.length > 0)
                ? hero.items.map(i => `
                    <div class="icon-item">
                        <img src="${i.icon}" alt="${i.name}" onerror="this.style.display='none'">
                        <span class="name">${i.name}</span>
                    </div>
                `).join('')
                : '<span class="empty-text">無核心裝備數據</span>';

            card.innerHTML = `
                <div class="hero-header">
                    <img src="${hero.avatar}" alt="${hero.name}" class="hero-avatar">
                    <div class="hero-info">
                        <div class="hero-name">${hero.name}</div>
                        <div class="hero-title">${hero.title}</div>
                    </div>
                </div>
                
                <div>
                    <div class="section-header title-rune">
                        <span>🔥 S 級強化符文</span>
                        <span class="badge-count">${runeCount} 個</span>
                    </div>
                    <div class="icon-list">${runesHTML}</div>
                </div>

                <div>
                    <div class="section-header title-item">
                        <span>🛡️ 核心成品大裝</span>
                        <span class="badge-count">${itemCount} 個</span>
                    </div>
                    <div class="icon-list">${itemsHTML}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterHeroes() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = Object.values(heroesData).filter(hero => 
            hero.name.toLowerCase().includes(query) || 
            hero.id.toLowerCase().includes(query)
        );
        renderHeroes(filtered);
    }
</script>

</body>
</html>

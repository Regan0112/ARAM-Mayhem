<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英雄聯盟：大混戰英雄即時搜尋</title>
  <style>
    body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #121212; color: #fff; }
    h2 { text-align: center; color: #5383e8; }
    input { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; box-sizing: border-box; }
    input:focus { outline: none; border-color: #5383e8; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid #333; text-align: center; }
    .hero-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #5383e8; margin-bottom: 10px; }
    .loading { color: #888; margin-top: 15px; text-align: center; display: none; }
    .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #5383e8; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .btn:hover { background: #4169e1; }
  </style>
</head>
<body>

  <h2>ARAM Mayhem 大混戰即時搜尋</h2>
  <input type="text" id="heroInput" placeholder="請輸入英雄中文或英文名稱 (例: 露露, lulu)...">
  
  <div id="loading" class="loading">搜尋中...</div>
  <div id="result"></div>

  <script>
    let heroList = {};
    const version = "14.1.1"; // Data Dragon 版本

    // 初始化：預先載入全英雄官方資料
    async function init() {
      try {
        const res = await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/zh_TW/champion.json`);
        const data = await res.json();
        heroList = data.data;
      } catch (e) {
        console.error("載入英雄資料失敗", e);
      }
    }
    init();

    document.getElementById('heroInput').addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const resultEl = document.getElementById('result');

      if (!query) {
        resultEl.innerHTML = '';
        return;
      }

      // 搜尋中文名稱或英文 ID
      const matchedHeroKey = Object.keys(heroList).find(key => {
        const hero = heroList[key];
        return hero.name.toLowerCase().includes(query) || hero.id.toLowerCase().includes(query);
      });

      if (matchedHeroKey) {
        const hero = heroList[matchedHeroKey];
        const opggUrl = `https://op.gg/zh-tw/lol/modes/aram-mayhem/${hero.id.toLowerCase()}/items`;
        
        resultEl.innerHTML = `
          <div class="card">
            <img class="hero-avatar" src="https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${hero.id}.png" alt="${hero.name}">
            <h3>${hero.name} (${hero.id})</h3>
            <p>定位：${hero.tags.join(', ')}</p>
            <p>${hero.blurb}</p>
            <a class="btn" href="${opggUrl}" target="_blank">點此開啟 OP.GG 查看最新大混戰出裝</a>
          </div>
        `;
      } else {
        resultEl.innerHTML = `<div class="card" style="color:#ff6b6b">未找到符合「${query}」的英雄</div>`;
      }
    });
  </script>
</body>
</html>
